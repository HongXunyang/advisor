name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    # Keep Python 3.9 available instead of following ubuntu-latest upgrades.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries for headless PyQt5
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            xauth \
            libegl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # Matplotlib's Qt backend also needs a valid X display, even when
        # Qt itself uses the offscreen platform plugin.
        run: xvfb-run -a python -m pytest -v
